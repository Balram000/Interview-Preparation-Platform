services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    volumes:
      - mongo-data:/data/db

  server:
    build: ./server
    restart: unless-stopped
    # Seeding is idempotent, so it is safe on every container start
    command: sh -c "node seedQuestions.js && node index.js"
    environment:
      NODE_ENV: production
      PORT: 5000
      MONGODB_URI: mongodb://mongo:27017/ai-interview-prep
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production}
      JWT_EXPIRE: ${JWT_EXPIRE:-30d}
      CLIENT_URL: ${CLIENT_URL:-http://localhost:8080}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
    depends_on:
      - mongo

  client:
    build:
      context: ./client
      args:
        REACT_APP_API_URL: /api
    restart: unless-stopped
    ports:
      - "8080:80"
    depends_on:
      - server

volumes:
  mongo-data:
